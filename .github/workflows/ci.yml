name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unified_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unified_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Test PostgreSQL persistence against a real database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unified_test
        run: npm run test:postgres
      - run: npm run build
